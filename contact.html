<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>

<body>
    <header>
        <h1>Mon Portfolio</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="presentation.html">Présentation</a></li>
                <li><a href="realisations.html">Réalisations</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contact-info">
            <h2>Contactez-moi</h2>
            <p><strong>Vous pouvez retrouver mes coordonnées sur mon CV !</strong></p>
            <div class="contact-details">
                <div class="contact-item">
                    <h2>Réseaux Sociaux</h2>
                    <ul class="social-links">
                        <li><a href="https://fr.linkedin.com/in/léane-buisson-a9910231a" target="_blank">
                                <img src="img/logo/linkedin.png" alt="LinkedIn" class="social-icon">
                            </a></li>
                        <li><a href="https://github.com/LeaneBu" target="_blank">
                                <img src="img/logo/github.png" alt="GitHub" class="social-icon">
                            </a></li>
                        <!-- <li><a href="https://instagram.com/allie_sushi?igshid=ZDc4ODBmNjlmNQ==" target="_blank">
                            <img src="img/logo/intasgram.png" alt="Instagram" class="social-icon">
                        </a></li> -->
                    </ul>
                </div>
            </div>
        </section>

        <section id="contact-form">
            <h1>Formulaire de Contact</h1>
            <form action="mailto:Leane.Buisson@etu.univ-grenoble-alpes.fr" method="post" enctype="text/plain">
                <label for="name">Nom :</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Objet :</label>
                <input type="text" id="subject" name="subject">

                <label for="message">Message :</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button class="form-button" type="submit">Envoyer</button>
            </form>
        </section>
    </main>

    <footer>
        <p>
            &copy; 2025 Mon Portfolio. Tous droits réservés.
        </p>
        <div class="ai-credit">
            <span class="ai-label">AIA</span>

            <div class="ai-tooltip">
                <i class="fa-solid fa-robot"></i>
                <span>
                    Aidé par l’Intelligence Artificielle
                </span>
            </div>
        </div>
    </footer>
</body>

</html>
